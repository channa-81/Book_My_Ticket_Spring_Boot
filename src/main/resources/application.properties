# Server Configuration
server.port=8081

# Application Name
spring.application.name=book_my_ticket

# Secret properties import
spring.config.import=optional:classpath:secret.properties

# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/book_my_ticket_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=Channa#99

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/book_my_ticket_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.url=redis://localhost:6379

# Enabling Debug Logging
logging.level.com.ypc.book_my_ticket=DEBUG
